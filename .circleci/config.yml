version: 2.1
jobs:
  full-source-verification:
    docker:
      - image: cimg/node:22.20.0
    resource_class: medium
    steps:
      - checkout
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run release:dry-run
  postgres-migrations-and-recovery:
    docker:
      - image: cimg/node:22.20.0
      - image: postgres:15-alpine
        environment:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: sie_test
    resource_class: medium
    environment:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sie_test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sie_test
      PGPASSWORD: postgres
    steps:
      - checkout
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/migrate.mjs
      - run: node --test db/test/*.test.mjs
      - run:
          name: Install PostgreSQL client
          command: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - run: bash db/scripts/backup_restore_test.sh
  security-status-record:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: E2EESA status integrity (not certification)
          command: python3 scripts/validate_e2eesa_status.py

workflows:
  complete-ci:
    jobs:
      - full-source-verification
      - postgres-migrations-and-recovery
      - security-status-record
